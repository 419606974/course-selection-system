version: '2'
services:
  web:
    build: .
    ports:
      - "8888:8888"  # 将端口改为 8888
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - FLASK_RUN_PORT=8888  # 设置环境变量

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course_selection_manage  # 修改数据库名称
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: