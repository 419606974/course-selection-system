  #studentTable th, #studentTable td {

                      <div class="form-group">

            <!--这里是一个编辑条目的模态框-->

<script type="text/javascript" src="static/js/index.min.js"></script>

<script type="text/javascript" src="static/js/jquery.cookie.min.js"></script>

<script type="text/javascript" src="static/js/jquery-treegrid/jquery.treegrid.min.js"></script>
<script type="text/javascript"
        src="static/js/bootstrap-table/extensions/treegrid/bootstrap-table-treegrid.min.js"></script>

<script type="text/javascript">
  $(document).ready(function () {
    accessControl();
    // 在页面加载完成后，从模板上下文中获取 teacher_infos 变量
    var majorInfos = {{major_infos | tojson| default('[]') }};
    // 向后端获取数据填充table
    $('#tb_departments').bootstrapTable({
      data: majorInfos,
      classes: 'table table-bordered table-hover table-striped',
      //method: 'get',
      dataType: 'jsonp',            // 因为本示例中是跨域的调用,所以涉及到ajax都采用jsonp,
      uniqueId: 'id',
      idField: 'id',              // 每行的唯一标识字段
      toolbar: '#toolbar',        // 工具按钮容器
      clickToSelect: false,       // 是否启用点击选中行
      striped: true,              // 是否显示行间隔色
      showColumns: true,         // 是否显示所有的列
      showRefresh: false,         // 是否显示刷新按钮,这个按钮这一般是在客户端分页的情况下使用
      showToggle: false,          // 是否显示详细视图和列表视图的切换按钮(clickToSelect同时设置为true时点击会报错)
      cache: false,               // 不缓存数据
      pagination: true,                    // 是否显示分页
      sortOrder: "asc",                    // 排序方式
      // 传递参数
      queryParams: function (params) {
        var temp = {
          limit: params.limit,         // 每页数据量
          offset: params.offset,       // sql语句起始索引
          page: (params.offset / params.limit) + 1,
          sort: params.sort,           // 排序的列名
          sortOrder: params.order      // 排序方式'asc' 'desc'
        };
        return temp;
      },
      sidePagination: "client",            // 分页方式：client客户端分页，server服务端分页
      pageNumber: 1,                       // 初始化加载第一页，默认第一页
      pageSize: 10,                        // 每页的记录行数
      pageList: [10, 20, 50, 100],         // 可供选择的每页的行数
      search: true,                      // 是否显示表格搜索，此搜索是客户端搜索
      showExport: true,        // 是否显示导出按钮, 导出功能需要导出插件支持(tableexport.min.js)
      exportDataType: "all", // 导出数据类型, 'basic':当前页, 'all':所有数据, 'selected':选中的数据
      exportOptions: {
        fileName: '专业信息表',
        ignoreColumn: ['detail', 'student_detail', 'operate'], // 忽略操作列导出
      },
      columns: [{
        field: 'example',
        checkbox: true    // 是否显示复选框
      }, {
        field: 'id', //columns里的field的值必须和后端返回的字段名一样
        title: 'ID', //columns里的title的值就是表格列名
        sortable: true,    // 是否排序
        align: 'center',
        visible: false,
      }, {
        field: 'name',
        title: '专业名称',
        align: 'center',
        formatter: function(value) {
          return `<strong>${value || ''}</strong>`;
        }
      }, {
        field: 'level',
        title: '所属学位',
        align: 'center',
      },{
        field: 'detail',
        title: '课程详情',
        align: 'center',
        formatter: btnDetail,  // 自定义方法
        events: {
          'click .info-btn': function (event, value, row, index) {
            infoRole(row);
          },
        }
      },{
        field: 'student_detail',
        title: '学生详情',
        align: 'center',
        formatter: function() {
          return '<a href="#" class="btn btn-xs btn-default m-r-5 student-btn" title="学生详情" data-toggle="tooltip"><i class="mdi mdi-account-box"></i></a>';
        },
        events: {
          'click .student-btn': function (event, value, row, index) {
            showStudentDetail(row);
          }
        }
      },{
        field: 'operate',
        title: '操作',
        align: 'center',
        formatter: btnHandle,  // 自定义方法
        events: {
          'click .edit-btn': function (event, value, row, index) {
            editRole(row);
          },
          'click .del-btn': function (event, value, row, index) {
            deleteRole(row);
          }
        }
        }],

      onLoadSuccess: function (data) {
        console.log("aaaaaa");

        $("[data-toggle='tooltip']").tooltip();


      }
    })
    $('#tb_departments').bootstrapTable('hideLoading'); // 手动关闭加载提示

  });

  $(function () {
    // 添加专业
    $('#btn-add').click(function () {
      var name = $('#major-add-name').val();
      var level = $('#major-add-level').val();

      sendPostRequest('/major/add', {
        name: name,
        level: level,
      }, function (data) {
        if (data.success) {
          // 前端更新表格数据，添加该条目（仅仅是前端更新）
          $('#tb_departments').bootstrapTable('append', {
            name: name,
            level: level,
          });
          notice(data.message, 'success');
        } else {
          notice(data.message, 'danger', 10000);
        }
      }, function (error) {
        console.error('Error:', error);
        notice(error.statusMessage, 'danger', 10000);
      });
      // 关闭模态框
      $('#exampleModalChange').modal('hide');
    });

    // 查询按钮添加点击事件
    $('#btn_search').click(function () {
      // 获取查询输入框的内容
      var keywords = $('#searchInput').val();
      // 发起 AJAX 请求
      $.getJSON('/major?query=' + encodeURIComponent(keywords), function (data) {
        // 使用 bootstrapTable('load', data.rows) 更新表格
        $('#tb_departments').bootstrapTable('load', data);
      });
    });
    // 为批量删除按钮添加点击事件
    $('#btn_delete').click(function () {
      var selectedRows = $('#tb_departments').bootstrapTable('getSelections');
      if (selectedRows.length === 0) {
        $.notify({message: "请至少选择一行"}, {type: 'warning', delay: 1000, placement: {align: 'center'}});
        return;
      }

      var selectedIds = selectedRows.map(row => row.id);

      $.confirm({
        title: '操作确认',
        content: '确定要删除选中的专业吗？<br>备注：若专业下的课程有对应成绩，则无法删除',
        buttons: {
          confirm: {
            text: '确认删除',
            btnClass: 'btn-danger',
            action: function () {
              fetch('/major/delete', {
                method: 'POST',
                body: JSON.stringify({ids: selectedIds}),
                headers: {'Content-Type': 'application/json;charset=UTF-8'}
              })
                      .then(response => response.json())
                      .then(data => {
                        if (data.success) {
                          $('#tb_departments').bootstrapTable('remove', {
                            field: 'id',
                            values: selectedIds
                          });
                          notice(data.message, 'success');
                        } else {
                          notice(data.message, 'error', 10000);
                        }
                      })
                      .catch(error => {
                        console.error('Error:', error);
                        notice('服务端错误', 'danger', 10000);
                      });
            }
          },
          cancel: {
            text: '取消'
          }
        }
      });
    });
  });

  // 操作按钮
  function btnHandle() {
    let html =
            '<a href="#!" class="btn btn-xs btn-default m-r-5 edit-btn" title="编辑" data-toggle="tooltip"><i class="mdi mdi-pencil"></i></a>' +
            '<a href="#!" class="btn btn-xs btn-default del-btn" title="删除" data-toggle="tooltip"><i class="mdi mdi-window-close"></i></a>';
    return html;
  }

  // 操作方法 - 编辑条目弹出框
  function editRole(row) {

    // 填充模态框中的表单
    $('#exampleModalEdit #exampleModalEditTitle').text('编辑条目');
    $('#exampleModalEdit #major-edit-name').val(row.name);
    $('#exampleModalEdit #major-edit-level').val(row.level);
    // 存储当前行的 id
    var currentRowId = row.id;
    // 显示模态框
    $('#exampleModalEdit').modal('show');

    // 将 id 作为数据附加到保存按钮上
    $('#btn-edit-save').data('current-row-id', currentRowId);
  }

  // 编辑角色保存
  $('#btn-edit-save').click(function () {
    // 从按钮数据中获取当前行的 id
    var currentRowId = $(this).data('current-row-id');
    var row = $('#tb_departments').bootstrapTable('getRowByUniqueId', currentRowId);
    var name = $('#exampleModalEdit #major-edit-name').val();
    var level = $('#exampleModalEdit #major-edit-level').val();

    // 检查是否有变更
    if (name === row.name && level === row.level) {
      $.alert({
        title: '无需更新',
        content: '你没有修改任何内容',
        type: 'blue'
      });
      return;
    }

    sendPostRequest('/major/update', {
      id: currentRowId,
      name: name,
      level: level,
    }, function (data) {
      if (data.success) {
        notice(data.message, 'success');
        // 前端更新表格数据，添加该条目（仅仅是前端更新）
        $('#tb_departments').bootstrapTable('updateByUniqueId', {
          // index: currentRowId - 1, // 使用 id 获取行索引
          id: currentRowId,
          row: {
            id: currentRowId, // 使用获取到的 id
            name: name,
            level: level,
          }
        });
      } else {
        notice(data.message, 'danger', 10000);

      }
    }, function (error) {
      console.error('Error:', error);
      notice('服务端错误', 'danger', 10000);

    });
    // 提交后关闭模态框
    $('#exampleModalEdit').modal('hide');
  });

  // 操作方法 - 删除单个条目
  function deleteRole(row) {
    var selectedRows = $('#tb_departments').bootstrapTable('getSelections');
    if (selectedRows.length !== 1) {
      notice("请先选中该行", 'warning');
      return;
    }
    var rowId = selectedRows[0].id;
    // 确认是否删除
    $.confirm({
      title: '操作确认',
      escapeKey: true,
      content: '确定要删除该专业吗？<br>备注：若专业下的课程有对应成绩，则无法删除',
      backgroundDismiss: true,
      buttons: {
        okay: {
          text: '确认',
          keys: ['enter'],
          btnClass: 'btn-blue',
          action: function () {
            // 发送 DELETE 请求到后端
            sendPostRequest('/major/delete', {id: rowId}, function (data) {
              if (data.success) {
                // 成功删除后，从表格中移除对应的条目
                $('#tb_departments').bootstrapTable('remove', {
                  field: 'id',
                  values: [rowId]
                });
                notice(data.message, 'success');
              } else {
                notice(data.message, 'danger', 10000);
              }
            }, function (error) {
              console.error('Error:', error);
              notice(error.statusMessage, 'danger', 10000);
            });
          }
        },
        cancel: {
          text: '取消',
          keys: ['ctrl', 'shift'],
          action: function () {
            return;
          }
        }
      },
    });

  }

  function accessControl() {
    const role = localStorage.getItem('role');

    if (role === '1') {
      // 如果 role 等于 '1'，显示按钮
      document.getElementById('btn_add').style.display = 'inline-block';
      document.getElementById('btn_delete').style.display = 'inline-block';
    } else {
      // 隐藏“操作”列
      $('#tb_departments').bootstrapTable('hideColumn', 'operate');
    }
  }

  // 页面加载时调用 accessControl 函数
  $(document).ready(function () {
    accessControl();
  });

  // 操作按钮
  function btnDetail() {
    let html =
            '<a href="#!" class="btn btn-xs btn-default m-r-5 info-btn" title="详情" data-toggle="tooltip"><i class="mdi mdi-information-outline"></i></a>';
    return html;
  }

  function infoRole(row) {
    const majorName = row.name;

    $.getJSON(`/course?major=${encodeURIComponent(majorName)}`, function (data) {
      if (!data || data.length === 0) {
        $('#courseTable tbody').html('<tr><td colspan="9" class="text-center">暂无该专业的课程数据</td></tr>');
      } else {
        displayMajorCourseDetails(data);
      }
      $('#courseModal').modal('show');
    });
  }

  function displayMajorCourseDetails(courses) {
    const $tableBody = $('#courseTable tbody');
    $tableBody.empty(); // 清空旧数据

    courses.forEach(item => {
      const row = `
      <tr>
        <td><strong>${item.name || ''}</strong></td>
        <td>${item.credits || ''}</td>
        <td>${item.major || ''}</td>
        <td>${item.category || ''}</td>
        <td>${item.startdate || ''}</td>
        <td>${item.enddate || ''}</td>
        <td>${item.teaching_time || ''}</td>
        <td>${item.teaching_place || ''}</td>
        <td>${item.teacher_name || ''}</td>
      </tr>`;
      $tableBody.append(row);
    });
  }

  function showStudentDetail(row) {
    const majorName = row.name;
    $.getJSON('/user?major_name=' + encodeURIComponent(majorName), function(data) {
      if (data.success && data.users.length > 0) {
        const $tableBody = $('#studentTable tbody');
        $tableBody.empty();
        data.users.forEach(u => {
          const tr = `
          <tr>
            <td><strong>${u.username || ''}</strong></td>
            <td><strong>${u.name || ''}</strong></td>
            <td>${u.enrollment_date || ''}</td>
            <td>${u.student_type || ''}</td>
            <td>${u.fellowship || ''}</td>
          </tr>`;
          $tableBody.append(tr);
        });
        $('#studentModal').modal('show');
      } else {
        $('#studentTable tbody').html('<tr><td colspan="5" class="text-center">暂无该专业的学生数据</td></tr>');
        $('#studentModal').modal('show');
      }
    }).fail(function() {
      alert('请求学生详情失败');
    });
  }

  $(document).ready(function () {
    $('#exportCourseBtn').click(function () {
      exportTableToExcel('courseTable', '课程详情');
    });

    $('#exportStudentBtn').click(function () {
      exportTableToExcel('studentTable', '学生详情');
    });
  });

  function exportTableToExcel(tableId, filename = '导出数据') {
    const wb = XLSX.utils.table_to_book(document.getElementById(tableId), { sheet: "Sheet1" });
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    saveAs(new Blob([wbout], { type: "application/octet-stream" }), filename + ".xlsx");
  }

</script>
